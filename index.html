<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <title>SHIS Stream</title>
  </head>
  <body>
    <div id="app">
      <main id="stage" class="stage home-mode" aria-label="Transmisión de Switch">
        <div class="room-scene">
          <img class="home-wall-unit" src="/home-floor-room.webp" alt="" aria-hidden="true" />
          <div id="tvScene" class="tv-scene">
            <section class="tv-shell" aria-label="Televisor retro gris">
              <div class="tv-face">
                <aside class="speaker-column speaker-left" aria-hidden="true">
                  <div class="speaker-grid"></div>
                </aside>

                <div id="homeScreenMount" class="screen-wrap">
                  <section id="player" class="player">
                    <div id="emptyState" class="empty-state">
                      <div class="noise" aria-hidden="true"></div>
                      <div class="no-signal-copy">
                        <strong>SIN SEÑAL</strong>
                        <span>AV1</span>
                      </div>
                    </div>

                    <div id="videoMount" class="video-mount"></div>
                    <div class="crt-overlay" aria-hidden="true"></div>
                    <div class="screen-glare" aria-hidden="true"></div>

                    <div class="osd osd-top">
                      <span class="osd-channel">AV1</span>
                      <span id="liveBadge" class="osd-state">STANDBY</span>
                    </div>

                    <div class="osd osd-bottom">
                      <span id="statusText" class="osd-status">CONECTANDO…</span>
                      <span id="roomText" class="osd-room"></span>
                    </div>
                  </section>
                </div>

                <aside class="speaker-column speaker-right" aria-hidden="true">
                  <div class="speaker-grid"></div>
                </aside>

                <div class="bottom-bar" aria-label="Controles del televisor">
                  <div class="bottom-buttons" aria-hidden="true">
                    <i></i><i></i><i></i><i></i><i></i>
                  </div>
                  <span class="sensor-dot" aria-hidden="true"></span>
                  <span class="power-lamp" aria-hidden="true"></span>
                  <button id="aspectButton" class="tv-action" type="button" aria-label="Cambiar proporción de la TV a 4:3" title="Cambiar proporción">16:9</button>
                </div>

                <div class="sticker-layer" aria-hidden="true">
                  <div class="sticker sticker-ball"></div>
                  <div class="sticker sticker-ranma"></div>
                  <div class="sticker sticker-sailor-face"></div>
                  <div class="sticker sticker-sailor-happy"></div>
                </div>
              </div>
            </section>
          </div>

          <div id="arcadeScene" class="arcade-scene" hidden aria-label="Máquina arcade vertical">
            <img class="arcade-art" src="/arcade-black-generated.webp" alt="" aria-hidden="true" />
            <div id="arcadeScreen" class="arcade-screen"></div>
          </div>
        </div>

        <nav class="scene-controls" aria-label="Controles de la actividad">
          <button id="modeButton" type="button" aria-label="Cambiar a modo arcade">Arcade</button>
          <button id="filterButton" type="button" aria-pressed="false" title="Activar filtro retro">Filtro retro</button>
          <button id="audioButton" type="button" hidden title="Activar audio">🔊 Audio</button>
          <button id="retryButton" type="button" hidden title="Reconectar">↻</button>
          <button id="exitButton" type="button" hidden title="Salir de la actividad">Salir</button>
        </nav>
        <div id="audioMount" aria-hidden="true"></div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
