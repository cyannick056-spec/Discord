<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c10" />
<title>SHIS Stream</title>
</head>
<body>
<div id="app">
<main class="stage" aria-label="Transmisión de Switch">
  <div class="room-scene">
    <div class="tv-scene">
      <section class="tv-shell" aria-label="Televisor retro plateado">
        <img class="sticker sticker-dragonball" src="/stickers/dragonball.webp" alt="" aria-hidden="true" />
        <img class="sticker sticker-ranma" src="/stickers/ranma.webp" alt="" aria-hidden="true" />
        <img class="sticker sticker-sailor-happy" src="/stickers/sailor-happy.webp" alt="" aria-hidden="true" />
        <img class="sticker sticker-sailor-tongue" src="/stickers/sailor-tongue.webp" alt="" aria-hidden="true" />

        <div class="tv-face">
          <aside class="tv-speaker tv-speaker-left" aria-hidden="true"><div class="speaker-grille"></div></aside>

          <div class="screen-column">
            <div class="screen-bezel">
              <section id="player" class="player">
                <div id="emptyState" class="empty-state">
                  <div class="noise" aria-hidden="true"></div>
                  <div class="no-signal-copy">
                    <strong>SIN SEÑAL</strong>
                    <span>AV1</span>
                  </div>
                </div>
                <div id="videoMount" class="video-mount"></div>
                <div class="crt-overlay" aria-hidden="true"></div>
                <div class="screen-glare" aria-hidden="true"></div>
                <div class="osd osd-top">
                  <span class="osd-channel">AV1</span>
                  <span id="liveBadge" class="osd-state">STANDBY</span>
                </div>
                <div class="osd osd-bottom">
                  <span id="statusText" class="osd-status">CONECTANDO…</span>
                  <span id="roomText" class="osd-room"></span>
                </div>
              </section>
            </div>
          </div>

          <aside class="tv-speaker tv-speaker-right" aria-hidden="true"><div class="speaker-grille"></div></aside>
        </div>

        <div class="tv-control-strip">
          <div class="control-cluster" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
            <span class="control-led"></span>
            <span class="control-notch"></span>
            <span class="control-knob"><b></b></span>
          </div>
          <div class="physical-controls">
            <button id="audioButton" class="physical-button" hidden title="Activar audio" aria-label="Activar audio">🔊</button>
            <button id="retryButton" class="physical-button" hidden title="Reconectar" aria-label="Reconectar">↻</button>
          </div>
        </div>
      </section>

      <div class="tv-feet" aria-hidden="true"><span></span><span></span></div>
    </div>

    <section class="retro-table" aria-label="Mesa retro con Nintendo 64">
      <div class="table-top">
        <div class="n64" aria-label="Nintendo 64 decorativa">
          <div class="n64-cart"><span>N64</span></div>
          <div class="n64-body">
            <span class="n64-logo">N</span>
            <i class="n64-port p1"></i><i class="n64-port p2"></i><i class="n64-port p3"></i><i class="n64-port p4"></i>
            <i class="n64-led"></i>
          </div>
        </div>
        <div class="n64-controller" aria-hidden="true">
          <i class="handle left"></i><i class="handle center"></i><i class="handle right"></i>
          <span class="stick"></span><span class="a-button">A</span><span class="b-button">B</span>
        </div>
      </div>
      <div class="table-legs" aria-hidden="true"><span></span><span></span></div>
    </section>
  </div>
  <div id="audioMount" aria-hidden="true"></div>
</main>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
