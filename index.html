<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=overlays-content"><meta name="theme-color" content="#000000"><meta name="referrer" content="origin"><title>Shis Stream</title></head>
<body><main id="stage" aria-label="Shis Stream">
 <section id="room" aria-label="Transmisión"><div id="photo"><img id="backdrop" alt="Sala nocturna"><div id="screen"><video id="video" autoplay muted playsinline></video><div id="retro"></div><div id="signal" role="status">Buscando señal…</div></div></div><div id="figures"></div><div id="loading">Cargando sala…</div></section>
 <nav id="controls" aria-label="Controles de la actividad"><button id="options" hidden>Opciones</button><button id="volumeButton" aria-expanded="false">Volumen</button><button id="exit">Salir</button></nav>
 <section id="volumePanel" class="panel" hidden><label>Volumen <output id="volumeValue">100%</output><input id="volume" type="range" min="0" max="100" value="100"></label><button id="enableAudio" hidden>Activar sonido</button></section>
 <section id="optionsPanel" class="panel" hidden><button id="edit">Editar</button><div class="row"><button data-aspect="16:9">16:9</button><button data-aspect="4:3">4:3</button></div><div class="row"><button data-scene="home">Sala</button><button data-scene="arcade">Solo pantalla</button></div><label>Filtro CRT<select id="filter"><option value="off">Apagado</option><option value="normal">Normal</option><option value="immersive">Intenso</option><option value="scanlines">Barridos</option></select></label><button id="smooth">Suavizado: sí</button><button id="reconnect">Reconectar</button></section>
 <section id="editor" hidden aria-label="Editar Shis Stream"><header><strong>Editar</strong><button id="focusEditor">Vista grande</button><button id="undo">Deshacer</button><button id="save">Guardar</button><button id="closeEditor">Cerrar</button></header><div id="editorBody"><div id="preview"><div id="previewRoom" class="preview-room"><div class="photo"><img class="backdrop" alt="Vista previa"><div class="screen"><span>Pantalla</span></div></div><div class="figures"></div></div></div><aside><nav class="row" aria-label="Vista de edición"><button data-view="landscape">Horizontal</button><button data-view="portrait">Vertical</button><button data-view="window">Ventana</button></nav><nav class="row"><button data-tab="figures">Figuritas</button><button data-tab="room">Sala</button></nav>
 <section id="figureTools"><label class="upload">Añadir PNG / GIF<input id="upload" type="file" accept="image/png,image/gif"></label><label>Figura<select id="figureList"></select></label><label>Nombre<input id="figureName" maxlength="70"></label><div class="row"><button id="copy">Duplicar</button><button id="hideFigure">Ocultar</button><button id="remove">Quitar de esta vista</button></div><label>Tamaño<input id="size" type="range" min="1" max="130" step=".5"></label><label>Giro<input id="rotation" type="range" min="-180" max="180"></label><div class="row"><button id="back">Capa −</button><button id="front">Capa +</button></div><div class="row"><button data-nudge="-1,0">←</button><button data-nudge="0,-1">↑</button><button data-nudge="0,1">↓</button><button data-nudge="1,0">→</button></div><button id="anchor">Anclar a sala</button><p>Arrastra la figura. Usa tamaño y capas para ajustarla.</p><details><summary>Espectadores</summary><div id="slotTools"></div></details></section>
 <section id="roomTools" hidden><div class="row"><button data-tv="crt">TV CRT</button><button data-tv="flat">TV plana</button></div><div class="row"><button data-edit-aspect="16:9">16:9</button><button data-edit-aspect="4:3">4:3</button></div><label>Zoom de sala<input id="zoom" type="range" min="1" max="2" step=".02"></label><label>Horizontal<input id="panX" type="range" min="-50" max="50"></label><label>Vertical<input id="panY" type="range" min="-50" max="50"></label><div class="row"><button data-fit="contain">Ver todo</button><button data-fit="cover">Llenar pantalla</button></div><button id="round">Curvas CRT: sí</button><button id="resetRoom">Restablecer encuadre</button><p>Los fondos conservan su TV y sus muebles. El zoom mueve la sala completa.</p></section><p id="editorStatus" role="status"></p></aside></div></section>
 <div id="compactNotice" hidden>Modo edición</div><div id="notice" role="status" hidden></div><audio id="audio" autoplay></audio>
 <dialog id="hostDialog"><form id="hostForm"><label>Clave de edición<input id="hostKey" type="password" autocomplete="current-password" required></label><p id="hostStatus" role="status"></p><div class="row"><button type="submit">Entrar</button><button id="cancelHost" type="button">Cancelar</button></div></form></dialog>
 <dialog id="closeDialog"><p>Hay cambios sin guardar.</p><button id="saveClose">Guardar y cerrar</button><button id="discardClose">Descartar</button><button id="cancelClose">Seguir editando</button></dialog>
</main><script type="module" src="/src/main.ts"></script></body></html>
