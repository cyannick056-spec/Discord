<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <title>SHIS Stream</title>
  </head>
  <body>
    <div id="app">
      <main class="stage" aria-label="Transmisión de Switch">
        <div class="room-scene">
          <div class="tv-scene">
            <section class="tv-shell" aria-label="Televisor retro gris">
              <div class="tv-face">
                <aside class="speaker-column speaker-left" aria-hidden="true">
                  <div class="speaker-grid"></div>
                </aside>

                <div class="screen-wrap">
                  <section id="player" class="player">
                    <div id="emptyState" class="empty-state">
                      <div class="noise" aria-hidden="true"></div>
                      <div class="no-signal-copy">
                        <strong>SIN SEÑAL</strong>
                        <span>AV1</span>
                      </div>
                    </div>

                    <div id="videoMount" class="video-mount"></div>
                    <div class="crt-overlay" aria-hidden="true"></div>
                    <div class="screen-glare" aria-hidden="true"></div>

                    <div class="osd osd-top">
                      <span class="osd-channel">AV1</span>
                      <span id="liveBadge" class="osd-state">STANDBY</span>
                    </div>

                    <div class="osd osd-bottom">
                      <span id="statusText" class="osd-status">CONECTANDO…</span>
                      <span id="roomText" class="osd-room"></span>
                    </div>
                  </section>
                </div>

                <aside class="speaker-column speaker-right" aria-hidden="true">
                  <div class="speaker-grid"></div>
                </aside>

                <div class="bottom-bar" aria-label="Controles del televisor">
                  <div class="bottom-buttons" aria-hidden="true">
                    <i></i><i></i><i></i><i></i><i></i>
                  </div>
                  <span class="sensor-dot" aria-hidden="true"></span>
                  <span class="power-lamp" aria-hidden="true"></span>
                  <button id="audioButton" class="physical-button" hidden title="Activar audio" aria-label="Activar audio">🔊</button>
                  <button id="retryButton" class="physical-button" hidden title="Reconectar" aria-label="Reconectar">↻</button>
                </div>

                <div class="sticker-layer" aria-hidden="true">
                  <img class="sticker sticker-ball" src="/stickers/dragonball.webp" alt="" />
                  <img class="sticker sticker-ranma" src="/stickers/ranma.webp" alt="" />
                  <img class="sticker sticker-sailor-face" src="/stickers/sailor-tongue.webp" alt="" />
                  <img class="sticker sticker-sailor-happy" src="/stickers/sailor-happy.webp" alt="" />
                </div>
              </div>
            </section>
          </div>

          <section class="retro-table" aria-label="Mueble de madera con Nintendo 64">
            <img class="cabinet-image" src="/n64-cabinet.webp" alt="Mueble de madera con Nintendo 64 y cartucho de portada negra" />
          </section>
        </div>

        <div id="audioMount" aria-hidden="true"></div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
