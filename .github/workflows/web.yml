name: Build Discord Activity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'relay/**'
      - 'src/**'
      - 'server.mjs'
      - 'cloudflare.mjs'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/**'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate VPS configuration
        run: |
          cp deploy/vps.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
      - name: Build VPS web image
        run: docker build -f deploy/Dockerfile.web -t shis-activity:ci .
