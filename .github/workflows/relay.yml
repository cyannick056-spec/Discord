name: Build SHIS Native Relay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'relay/**'
      - 'src/**'
      - 'server.mjs'
      - 'cloudflare.mjs'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: relay/go.mod
      - name: Install native audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopus-dev libopusfile-dev libsoxr-dev
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -o shis-relay .
